<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Patient Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/styles.css" />

</head>

<body>

  <!-- ============= NAVIGATIONBAR ================= -->

  <nav class="navbar">

    <div class="nav-left">
      <img src="./assets/icons/logo.svg" alt="Tech Care Logo">
    </div>

    <ul class="nav-menu">
      <li class="nav-menu li">
        <img src="./assets/icons/home.png" alt="Overview Icon">
        <span>Overview</span>
      </li class="nav-menu li">
      <li class="active">
        <img src="./assets/icons/group.png" alt="Patients Icon">
        <span>Patients</span>
      </li> 
      <li class="nav-menu li">
        <img src="./assets/icons/calendar_today.png" alt="Schedule Icon">
        <span>Schedule</span>
      </li>
      <li class="nav-menu li">
        <img src="./assets/icons/chat_bubble.png" alt="Message Icon">
        <span>Message</span>
      </li>
      <li class="nav-menu li">
        <img src="./assets/icons/credit_card.png" alt="Transactions Icon">
        <span>Transactions</span>
      </li>
    </ul>

    <div class="nav-doctor-info">
      <img src="./assets/images/doctor-avatar.png" alt="Doctor">
      <div>
        <p class="body-emphasized-14pt">Dr. Jose Simmons</p>
        <span class="body-secondary-info-14pt">General Practitioner</span>
      </div>
    </div>

  </nav>

  <!-- ================= DASHBOARD ================= -->

  <main class="dashboard">
